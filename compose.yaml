name: coffegroup

services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python scripts/init_local_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run python scripts/init_local_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_local_env.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:

