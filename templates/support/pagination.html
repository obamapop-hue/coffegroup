{% if tickets.has_other_pages %}<nav class="pagination" aria-label="문의 목록 페이지">{% if tickets.has_previous %}<a href="?page={{ tickets.previous_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">이전</a>{% endif %}<span>{{ tickets.number }} / {{ tickets.paginator.num_pages }}</span>{% if tickets.has_next %}<a href="?page={{ tickets.next_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">다음</a>{% endif %}</nav>{% endif %}
