<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">

    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <title>영차 · 로고 시안</title>
    <style>

      body { margin: 0; padding: 44px 24px; background: #fff; text-align: center; }

      h1 { margin: 0; font-size: 22px; }
      p { color: #716767; font-size: 14px; line-height: 1.7; }
      img { display: block; width: min(100%, 360px); height: auto; margin: 24px auto; }
      a { display: inline-block; padding: 12px; color: #ce2b25; font-size: 14px; }

  </head>
  <body>
    <main>
      <h1>영차 로고 시안</h1>

      <img src="yeongcha-arm-outline.png" alt="빨간 윤곽선으로 단순하고 둥글게 표현한, 이두근을 자랑하는 귀여운 팔 일러스트" width="1254" height="1254">
      <p>영차 로고 일러스트입니다.</p>
      <a href="yeongcha-arm-outline.png">원본 이미지 보기</a>
